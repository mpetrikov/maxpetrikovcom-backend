info:
  name: Refresh Token
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/refresh"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        bru.setVar("accessToken", body.access_token);
        bru.setVar("refreshToken", body.refresh_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
